<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo | Clínica Recriar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="img/Logo recriar.png">
    
    <link rel="stylesheet" href="styles/gateway.css">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6GT8FRV5GG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-6GT8FRV5GG');
    </script>
</head>
<body>

    <div class="gateway-container">
        <img src="img/Logo recriar.png" alt="Clínica Recriar" class="gateway-logo">
        
        <h1 class="gateway-title">Bem-vindo à Recriar</h1>
        <p class="gateway-subtitle">Selecione a unidade desejada para atendimento:</p>

        <div class="units-grid">
            <a href="home.html" class="unit-card">
                <div class="unit-icon">
                    <i data-lucide="map-pin"></i>
                </div>
                <span class="unit-name">Unidade Canabarro</span>
                <p class="unit-address">Rua General Canabarro, 458<br>Centro, Rio Grande - RS</p>
                <span class="btn-enter">Acessar Unidade</span>
            </a>

            <a href="home.html" class="unit-card">
                <div class="unit-icon">
                    <i data-lucide="building-2"></i>
                </div>
                <span class="unit-name">Unidade II</span>
                <p class="unit-address">Endereço da nova unidade<br>Rio Grande - RS</p>
                <span class="btn-enter">Acessar Unidade</span>
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
