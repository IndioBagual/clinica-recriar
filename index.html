<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo | Clínica Recriar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="img/Logo recriar.png">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#00A79D', // Verde Principal
                            dark: '#008075',
                        },
                        text: {
                            DEFAULT: '#374151',
                            light: '#6b7280',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6GT8FRV5GG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-6GT8FRV5GG');
    </script>
</head>
<body class="font-sans antialiased h-screen w-full overflow-hidden relative">

    <div class="absolute inset-0 bg-cover bg-center z-0" style="background-image: url('img/frente.jpg');">
        <div class="absolute inset-0 bg-white/90 backdrop-blur-sm"></div>
    </div>

    <div class="relative z-10 flex flex-col items-center justify-center h-full w-full px-4 sm:px-6">
        
        <div class="text-center mb-12 max-w-2xl mx-auto">
            <img src="img/Logo recriar.png" alt="Clínica Recriar" class="w-64 mx-auto mb-8 drop-shadow-sm">
            
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-2">Bem-vindo à Recriar</h1>
            <p class="text-lg md:text-xl font-medium text-brand">Selecione a unidade desejada para atendimento:</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
            
            <a href="home.html" class="group bg-white p-10 rounded-2xl shadow-lg hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 border-2 border-transparent hover:border-brand flex flex-col items-center text-center gap-4">
                <div class="text-brand group-hover:scale-110 transition-transform duration-300">
                    <i data-lucide="map-pin" class="w-16 h-16"></i>
                </div>
                
                <span class="text-2xl font-bold text-brand-dark group-hover:text-brand transition-colors">Unidade Canabarro</span>
                
                <p class="text-gray-500 text-sm leading-relaxed max-w-[200px]">
                    Rua General Canabarro, 458<br>
                    Centro, Rio Grande - RS
                </p>
                
                <span class="mt-4 px-6 py-2 bg-brand text-white rounded-full font-bold text-sm shadow-md group-hover:bg-brand-dark transition-colors">
                    Acessar Unidade
                </span>
            </a>

            <div class="relative bg-white p-10 rounded-2xl shadow-lg border-2 border-gray-100 flex flex-col items-center text-center gap-4 overflow-hidden">
                
                <div class="absolute inset-0 z-20 bg-white/60 backdrop-blur-[2px] flex items-center justify-center cursor-not-allowed">
                    <div class="bg-yellow-400 text-yellow-900 font-black px-8 py-3 transform -rotate-12 shadow-xl border-y-4 border-yellow-500 text-lg uppercase tracking-widest">
                        Novidades em Breve
                    </div>
                </div>

                <div class="text-gray-300">
                    <i data-lucide="building-2" class="w-16 h-16"></i>
                </div>
                
                <span class="text-2xl font-bold text-gray-400">Unidade Abreu</span>
                
                <p class="text-gray-400 text-sm leading-relaxed max-w-[200px]">
                    Rua General Abreu, 52<br>
                    Cidade Nova, Rio Grande - RS
                </p>
                
                <span class="mt-4 px-6 py-2 bg-gray-200 text-gray-400 rounded-full font-bold text-sm shadow-none">
                    Acessar Unidade
                </span>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
