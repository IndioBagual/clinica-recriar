<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site em Manutenção</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: '#00A79D' },
                    animation: { 'float': 'float 4s ease-in-out infinite' },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6GT8FRV5GG"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-6GT8FRV5GG');
    </script>
</head>
<body class="font-[Inter] bg-[#f9fafb] text-gray-700 h-screen flex flex-col items-center justify-center p-6 text-center">
    
    <div class="max-w-xl w-full">
        <div class="text-brand mb-8 flex justify-center animate-float">
            <i data-lucide="wrench" class="w-20 h-20"></i>
        </div>
        
        <h1 class="text-4xl md:text-5xl font-bold mb-4 text-gray-800">Estamos em Manutenção</h1>
        
        <p class="text-lg md:text-xl text-gray-500 leading-relaxed">
            Nosso site está passando por algumas melhorias e voltará em breve.
            <br>
            Agradecemos a sua paciência!
        </p>

        <a href="/home.html" class="mt-8 inline-block text-brand font-semibold hover:underline">
            Voltar para a Home
        </a>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
